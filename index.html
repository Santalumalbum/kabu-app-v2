<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1a1a2e">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>株ダッシュボード</title>
  <style>
    :root {
      --bg:      #f2f2f7;
      --card:    #ffffff;
      --text:    #1c1c1e;
      --sub:     #6e6e73;
      --border:  rgba(0,0,0,0.08);
      --primary: #007aff;
      --success: #34c759;
      --warning: #ff9500;
      --danger:  #ff3b30;
      --radius:  16px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:     #1c1c1e;
        --card:   #2c2c2e;
        --text:   #f2f2f7;
        --sub:    #8e8e93;
        --border: rgba(255,255,255,0.08);
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      min-height: 100dvh;
    }

    /* ヘッダー */
    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px env(safe-area-inset-top, 0) 16px;
      position: sticky; top: 0; z-index: 20;
      display: flex; align-items: center; justify-content: space-between;
    }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .header-icon { width: 32px; height: 32px; border-radius: 8px; }
    .header-title { font-size: 1.1rem; font-weight: 700; }
    .header-updated { font-size: 0.72rem; color: var(--sub); }

    /* 更新ボタン */
    .btn-update {
      background: var(--primary); color: #fff; border: none;
      border-radius: 20px; padding: 7px 16px;
      font-size: 0.85rem; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; gap: 6px;
      transition: opacity 0.2s;
    }
    .btn-update:disabled { opacity: 0.5; }
    .btn-update .icon { display: inline-block; }
    .btn-update.spinning .icon { animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ツールバー（検索・フィルター）*/
    .toolbar {
      padding: 8px 12px; display: flex; gap: 8px; align-items: center;
      flex-wrap: wrap;
    }
    .search-box {
      flex: 1; min-width: 140px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; padding: 7px 12px;
      font-size: 0.9rem; color: var(--text); outline: none;
    }
    .search-box::placeholder { color: var(--sub); }
    .filters { display: flex; gap: 6px; }
    .filter-btn {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 20px; padding: 6px 14px;
      font-size: 0.82rem; font-weight: 600; cursor: pointer;
      color: var(--sub); transition: all 0.15s;
    }
    .filter-btn.active {
      background: var(--primary); border-color: var(--primary);
      color: #fff;
    }
    .filter-btn.active-buy {
      background: var(--success); border-color: var(--success);
      color: #fff;
    }
    .sort-select {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; padding: 6px 10px;
      font-size: 0.82rem; color: var(--text); outline: none;
    }

    /* 統計バー */
    .stats {
      display: flex; gap: 8px;
      padding: 10px 12px; overflow-x: auto;
      scrollbar-width: none;
    }
    .stats::-webkit-scrollbar { display: none; }
    .stat {
      background: var(--card); border-radius: 12px;
      padding: 10px 14px; min-width: 90px; flex-shrink: 0;
      border: 1px solid var(--border);
    }
    .stat-label { font-size: 0.68rem; color: var(--sub); white-space: nowrap; }
    .stat-value { font-size: 1.05rem; font-weight: 700; margin-top: 2px; }
    .stat-value.buy   { color: var(--success); }
    .stat-value.warn  { color: var(--warning); }

    /* ポートフォリオバナー */
    .portfolio-banner {
      margin: 0 12px 4px;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      border-radius: 14px; padding: 14px 18px;
      display: flex; justify-content: space-around;
      color: #fff;
    }
    .pf-item { text-align: center; }
    .pf-label { font-size: 0.68rem; opacity: 0.7; }
    .pf-value { font-size: 1.05rem; font-weight: 700; margin-top: 3px; }
    .pf-value.dividend { color: #4facfe; }

    /* 前日比チップ */
    .change-chip {
      display: inline-block; font-size: 0.75rem; font-weight: 700;
      padding: 2px 8px; border-radius: 20px; margin-top: 4px;
    }
    .change-up   { background: #d4f5de; color: #1a7a35; }
    .change-down { background: #fde8e8; color: #c0392b; }
    .change-flat { background: #e8e8ee; color: var(--sub); }
    @media (prefers-color-scheme: dark) {
      .change-up   { background: #1a4d28; color: #4cd964; }
      .change-down { background: #4d1a1a; color: #ff6b6b; }
      .change-flat { background: #3a3a3c; }
    }

    /* 保有バッジ */
    .owned-row {
      margin-top: 8px; font-size: 0.75rem; color: var(--sub);
      display: flex; gap: 8px;
    }

    /* カードグリッド */
    .cards {
      padding: 8px 12px calc(env(safe-area-inset-bottom, 0px) + 20px);
      display: grid; gap: 10px;
    }
    @media (min-width: 600px)  { .cards { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 900px)  { .cards { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 1200px) { .cards { grid-template-columns: repeat(4, 1fr); } }

    /* タブ */
    .tabs {
      display: flex; border-bottom: 2px solid var(--border);
      padding: 0 12px; background: var(--card);
    }
    .tab-btn {
      padding: 10px 18px; font-size: 0.9rem; font-weight: 600;
      background: none; border: none; color: var(--sub); cursor: pointer;
      border-bottom: 2px solid transparent; margin-bottom: -2px;
      transition: all 0.15s;
    }
    .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }

    /* カレンダービュー */
    .calendar-view {
      padding: 10px 12px calc(env(safe-area-inset-bottom,0) + 20px);
      display: grid; gap: 8px;
      grid-template-columns: repeat(3, 1fr);
    }
    @media (min-width: 600px) { .calendar-view { grid-template-columns: repeat(4, 1fr); } }
    @media (min-width: 900px) { .calendar-view { grid-template-columns: repeat(6, 1fr); } }

    .cal-month {
      background: var(--card); border-radius: 14px;
      border: 1px solid var(--border);
      padding: 12px 10px; text-align: center; position: relative;
    }
    .cal-month.has-dividend { border-color: var(--primary); }
    .cal-month.is-current   { background: #e8f0fe; }
    @media (prefers-color-scheme: dark) {
      .cal-month.is-current { background: #1a2a4a; }
    }
    .cal-month-name  { font-size: 0.75rem; color: var(--sub); font-weight: 600; }
    .cal-month-num   { font-size: 1.6rem; font-weight: 800; line-height: 1.2; }
    .cal-amount      { font-size: 0.8rem; font-weight: 700; color: var(--primary); margin-top: 4px; }
    .cal-stocks      { font-size: 0.65rem; color: var(--sub); margin-top: 4px; line-height: 1.4; }
    .cal-today-badge {
      position: absolute; top: -6px; left: 50%; transform: translateX(-50%);
      background: var(--primary); color: #fff;
      font-size: 0.6rem; font-weight: 700; padding: 1px 6px; border-radius: 10px;
    }

    /* 年間サマリーバナー */
    .year-summary {
      margin: 8px 12px 0;
      background: linear-gradient(135deg, #0f3460 0%, #16213e 100%);
      border-radius: 16px; padding: 16px 20px; color: #fff;
      text-align: center;
    }
    .year-summary .ys-label { font-size: 0.75rem; opacity: 0.7; }
    .year-summary .ys-value { font-size: 2rem; font-weight: 800; margin-top: 4px; }
    .year-summary .ys-value span { font-size: 1rem; }
    .year-summary .ys-sub   { font-size: 0.75rem; opacity: 0.6; margin-top: 4px; }

    /* 銘柄カード */
    .card {
      background: var(--card); border-radius: var(--radius);
      padding: 14px 16px; border: 1px solid var(--border);
      transition: transform 0.15s;
    }
    .card:active { transform: scale(0.98); }

    .card-top { display: flex; justify-content: space-between; align-items: flex-start; }
    .card-name { font-weight: 700; font-size: 0.97rem; line-height: 1.3; }
    .card-code { font-size: 0.75rem; color: var(--sub); margin-top: 2px; }

    /* バッジ */
    .badge {
      font-size: 0.72rem; font-weight: 700;
      padding: 3px 10px; border-radius: 20px; white-space: nowrap; flex-shrink: 0;
    }
    .badge-buy  { background: #d4f5de; color: #1a7a35; }
    .badge-hold { background: #e8e8ee; color: var(--sub); }
    .badge-fail { background: #fde8e8; color: #c0392b; }
    @media (prefers-color-scheme: dark) {
      .badge-buy  { background: #1a4d28; color: #4cd964; }
      .badge-hold { background: #3a3a3c; color: var(--sub); }
      .badge-fail { background: #4d1a1a; color: #ff6b6b; }
    }

    /* 数値グリッド */
    .card-metrics {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 8px 12px; margin-top: 12px;
    }
    .metric-label { font-size: 0.68rem; color: var(--sub); }
    .metric-value { font-size: 1rem; font-weight: 600; margin-top: 1px; }

    /* ギャップバー */
    .gap-bar { margin-top: 10px; }
    .gap-track {
      height: 5px; border-radius: 3px;
      background: var(--border); overflow: hidden;
    }
    .gap-fill {
      height: 100%; border-radius: 3px;
      background: linear-gradient(90deg, #4facfe, #00f2fe);
      transition: width 0.5s ease;
    }
    .gap-label { font-size: 0.68rem; color: var(--sub); margin-top: 3px; }

    /* 受取記録ビュー */
    .record-hero {
      margin: 12px 12px 0;
      background: linear-gradient(135deg, #1a3a1a 0%, #0d2b0d 100%);
      border-radius: 18px; padding: 20px 24px; color: #fff; text-align: center;
    }
    .record-hero .rh-label { font-size: 0.8rem; opacity: 0.7; letter-spacing: 0.05em; }
    .record-hero .rh-total {
      font-size: 2.6rem; font-weight: 900; margin: 6px 0 2px;
      color: #4cd964; letter-spacing: -0.02em;
    }
    .record-hero .rh-total span { font-size: 1.2rem; }
    .record-hero .rh-sub  { font-size: 0.8rem; opacity: 0.6; }
    .record-hero .rh-year { margin-top: 12px; font-size: 0.85rem; opacity: 0.85; }

    .record-section { padding: 12px 12px 0; }
    .record-section h3 { font-size: 0.85rem; color: var(--sub); margin-bottom: 8px; font-weight: 600; }

    /* 棒グラフ */
    .bar-chart { display: flex; align-items: flex-end; gap: 4px; height: 80px; }
    .bar-col    { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .bar-col .bar {
      width: 100%; border-radius: 4px 4px 0 0;
      background: linear-gradient(180deg, #4cd964, #34a84a);
      min-height: 2px; transition: height 0.4s ease;
    }
    .bar-col .bar-label { font-size: 0.55rem; color: var(--sub); white-space: nowrap; }

    /* 記録入力フォーム */
    .record-form {
      background: var(--card); border-radius: 16px;
      border: 1px solid var(--border); padding: 16px;
      margin: 0 12px;
    }
    .record-form h3 { font-size: 0.9rem; font-weight: 700; margin-bottom: 12px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
    .form-field label { font-size: 0.72rem; color: var(--sub); display: block; margin-bottom: 3px; }
    .form-field input, .form-field select {
      width: 100%; padding: 8px 10px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--bg);
      color: var(--text); font-size: 0.9rem; outline: none;
    }
    .form-field.full { grid-column: 1 / -1; }
    .btn-save {
      width: 100%; margin-top: 10px;
      background: var(--success); color: #fff; border: none;
      border-radius: 12px; padding: 12px; font-size: 1rem;
      font-weight: 700; cursor: pointer; transition: opacity 0.2s;
    }
    .btn-save:disabled { opacity: 0.5; }

    /* 記録一覧 */
    .record-list { margin: 0 12px; }
    .record-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 11px 14px; background: var(--card);
      border-radius: 12px; margin-bottom: 6px;
      border: 1px solid var(--border);
    }
    .record-item .ri-left .ri-name  { font-weight: 600; font-size: 0.9rem; }
    .record-item .ri-left .ri-date  { font-size: 0.72rem; color: var(--sub); margin-top: 1px; }
    .record-item .ri-amount { font-size: 1rem; font-weight: 700; color: var(--success); }

    /* top銘柄 */
    .top-stocks { display: flex; flex-direction: column; gap: 6px; }
    .top-stock-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 12px; background: var(--card); border-radius: 10px;
      border: 1px solid var(--border);
    }
    .ts-bar-wrap { flex: 1; margin: 0 12px; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
    .ts-bar { height: 100%; background: var(--success); border-radius: 3px; }

    /* ローディング・エラー */
    .placeholder { text-align: center; padding: 60px 20px; color: var(--sub); font-size: 0.9rem; }
    .error-box {
      background: #fde8e8; color: #c0392b;
      border-radius: 12px; padding: 16px; margin: 12px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <img src="icon.svg" class="header-icon" alt="icon">
    <div>
      <div class="header-title">株ダッシュボード</div>
      <div class="header-updated" id="updatedAt">読み込み中...</div>
    </div>
  </div>
  <button class="btn-update" id="updateBtn">
    <span class="icon">↻</span> 更新
  </button>
</header>

<div class="tabs">
  <button class="tab-btn active" id="tabDashboard">ダッシュボード</button>
  <button class="tab-btn" id="tabCalendar">📅 カレンダー</button>
  <button class="tab-btn" id="tabRecord">💰 受取記録</button>
</div>
<div id="viewDashboard">
<div class="portfolio-banner" id="portfolioBanner" style="display:none"></div>
<div class="toolbar">
  <input class="search-box" id="searchBox" type="search" placeholder="🔍 銘柄名・コードで検索">
  <div class="filters">
    <button class="filter-btn active" id="filterAll">全て</button>
    <button class="filter-btn" id="filterBuy">買い</button>
    <button class="filter-btn" id="filterHold">様子見</button>
  </div>
  <select id="sortSelect" class="sort-select">
    <option value="gap">ギャップ順</option>
    <option value="yield">利回り順</option>
    <option value="change">前日比順</option>
    <option value="code">コード順</option>
  </select>
</div>
<div class="stats" id="stats"></div>
<div class="cards" id="cards">
  <div class="placeholder">読み込み中...</div>
</div>
</div><!-- /viewDashboard -->

<div id="viewRecord" style="display:none">
  <div class="placeholder" id="recordLoading">読み込み中...</div>
</div>

<div id="viewCalendar" style="display:none">
  <div class="year-summary" id="yearSummary">
    <div class="ys-label">年間配当見込み</div>
    <div class="ys-value">-</div>
    <div class="ys-sub">保有数量・配当月を入力すると計算されます</div>
  </div>
  <div class="calendar-view" id="calendarGrid"></div>
</div>

<script>
  let isLoading = false;
  let allItems = [];
  let activeFilter = 'all';
  let activeTab = 'dashboard';

  // タブ切り替え
  document.getElementById('tabDashboard').addEventListener('click', function() {
    activeTab = 'dashboard';
    document.getElementById('tabDashboard').classList.add('active');
    document.getElementById('tabCalendar').classList.remove('active');
    document.getElementById('tabRecord').classList.remove('active');
    document.getElementById('viewDashboard').style.display = '';
    document.getElementById('viewCalendar').style.display = 'none';
    document.getElementById('viewRecord').style.display = 'none';
  });
  document.getElementById('tabCalendar').addEventListener('click', function() {
    activeTab = 'calendar';
    document.getElementById('tabCalendar').classList.add('active');
    document.getElementById('tabDashboard').classList.remove('active');
    document.getElementById('tabRecord').classList.remove('active');
    document.getElementById('viewDashboard').style.display = 'none';
    document.getElementById('viewCalendar').style.display = '';
    document.getElementById('viewRecord').style.display = 'none';
  });
  document.getElementById('tabRecord').addEventListener('click', function() {
    activeTab = 'record';
    document.getElementById('tabRecord').classList.add('active');
    document.getElementById('tabDashboard').classList.remove('active');
    document.getElementById('tabCalendar').classList.remove('active');
    document.getElementById('viewDashboard').style.display = 'none';
    document.getElementById('viewCalendar').style.display = 'none';
    document.getElementById('viewRecord').style.display = '';
    if (!recordLoaded) loadRecords();
  });

  function getFiltered() {
    const q = document.getElementById('searchBox').value.trim().toLowerCase();
    return allItems.filter(item => {
      const matchFilter =
        activeFilter === 'all' ||
        (activeFilter === 'buy'  && item.judge.indexOf('買') !== -1) ||
        (activeFilter === 'hold' && item.judge.indexOf('買') === -1);
      const matchSearch = !q ||
        item.name.toLowerCase().indexOf(q) !== -1 ||
        item.code.toLowerCase().indexOf(q) !== -1;
      return matchFilter && matchSearch;
    });
  }

  function setFilter(f) {
    activeFilter = f;
    document.getElementById('filterAll') .classList.toggle('active',     f === 'all');
    document.getElementById('filterBuy') .classList.toggle('active-buy', f === 'buy');
    document.getElementById('filterHold').classList.toggle('active',     f === 'hold');
    renderCards(getFiltered());
  }

  document.getElementById('filterAll') .addEventListener('click', function() { setFilter('all');  });
  document.getElementById('filterBuy') .addEventListener('click', function() { setFilter('buy');  });
  document.getElementById('filterHold').addEventListener('click', function() { setFilter('hold'); });
  document.getElementById('searchBox') .addEventListener('input',  function() { renderCards(getFiltered()); });

  // ソート
  let sortKey = 'gap';
  document.getElementById('sortSelect').addEventListener('change', function() {
    sortKey = this.value;
    renderCards(getFiltered());
  });

  function setLoading(on) {
    isLoading = on;
    const btn = document.getElementById('updateBtn');
    btn.disabled = on;
    btn.classList.toggle('spinning', on);
  }

  function load(forceUpdate) {
    if (isLoading) return;
    setLoading(true);

    const fn = forceUpdate ? 'runManualUpdate' : 'getDisplayData';

    google.script.run
      .withSuccessHandler(function(res) {
        setLoading(false);
        if (!res || !res.ok) {
          document.getElementById('cards').innerHTML =
            '<div class="error-box">⚠️ ' + (res && res.message ? res.message : '不明なエラー') + '</div>';
          return;
        }
        render(res);
      })
      .withFailureHandler(function(err) {
        setLoading(false);
        document.getElementById('cards').innerHTML =
          '<div class="error-box">⚠️ ' + err.message + '</div>';
      })
      [fn]();
  }

  function render(res) {
    document.getElementById('updatedAt').textContent =
      res.updatedAt || '更新日時不明';

    allItems = res.items || [];
    renderStats(allItems);
    renderCards(getFiltered());
    renderPortfolio(res.portfolio);
    renderCalendar(res.calendar, res.portfolio);
  }

  function renderStats(items) {
    const buyItems  = items.filter(i => i.judge.indexOf('買') !== -1);
    const yields    = items.map(i => parseFloat(i.divYield)).filter(v => !isNaN(v));
    const avgYield  = yields.length
      ? (yields.reduce((a, b) => a + b, 0) / yields.length).toFixed(2) : '-';
    const gaps = items.map(i => {
      const d = parseFloat(i.divYield), e = parseFloat(i.ideal);
      return (!isNaN(d) && !isNaN(e)) ? d - e : null;
    }).filter(v => v !== null);
    const maxGap = gaps.length ? Math.max(...gaps).toFixed(2) : '-';

    const stats = [
      { label: '全銘柄',     value: items.length + '件',   cls: '' },
      { label: '買い候補',   value: buyItems.length + '件', cls: buyItems.length > 0 ? 'buy' : '' },
      { label: '平均配当利回', value: avgYield + '%',       cls: '' },
      { label: '最大ギャップ', value: maxGap + '%',         cls: parseFloat(maxGap) > 0 ? 'buy' : '' },
    ];

    document.getElementById('stats').innerHTML = stats.map(s =>
      '<div class="stat">' +
        '<div class="stat-label">' + s.label + '</div>' +
        '<div class="stat-value ' + s.cls + '">' + s.value + '</div>' +
      '</div>'
    ).join('');
  }

  function renderCards(items) {
    if (items.length === 0) {
      document.getElementById('cards').innerHTML =
        '<div class="placeholder">銘柄リストにデータがありません</div>';
      return;
    }

    const sorted = items.slice().sort((a, b) => {
      if (sortKey === 'yield') {
        return (parseFloat(b.divYield) || 0) - (parseFloat(a.divYield) || 0);
      }
      if (sortKey === 'change') {
        const ca = (parseFloat(a.price) - parseFloat(a.prevClose)) / (parseFloat(a.prevClose) || 1);
        const cb = (parseFloat(b.price) - parseFloat(b.prevClose)) / (parseFloat(b.prevClose) || 1);
        return (isNaN(cb) ? -99 : cb) - (isNaN(ca) ? -99 : ca);
      }
      if (sortKey === 'code') {
        return String(a.code).localeCompare(String(b.code));
      }
      // default: gap
      const ga = parseFloat(a.divYield) - parseFloat(a.ideal);
      const gb = parseFloat(b.divYield) - parseFloat(b.ideal);
      return (isNaN(gb) ? -99 : gb) - (isNaN(ga) ? -99 : ga);
    });

    document.getElementById('cards').innerHTML = sorted.map(item => {
      const isBuy   = item.judge.indexOf('買') !== -1;
      const isFail  = item.source === 'FAIL';
      const badgeCls  = isFail ? 'badge-fail' : isBuy ? 'badge-buy' : 'badge-hold';
      const badgeTxt  = isFail ? '取得失敗' : isBuy ? '買い' : '様子見';

      const divY  = parseFloat(item.divYield);
      const ideal = parseFloat(item.ideal);
      const gap   = (!isNaN(divY) && !isNaN(ideal)) ? (divY - ideal).toFixed(2) : '-';
      const pct   = (!isNaN(divY) && !isNaN(ideal) && ideal > 0)
        ? Math.min(100, Math.round(divY / ideal * 100)) : 0;

      const priceNum = parseFloat(item.price.replace(/,/g,''));
      const prevNum  = parseFloat(item.prevClose);
      let changeChip = '';
      if (!isNaN(priceNum) && !isNaN(prevNum) && prevNum > 0) {
        const diff = priceNum - prevNum;
        const pct  = (diff / prevNum * 100).toFixed(2);
        const cls  = diff > 0 ? 'change-up' : diff < 0 ? 'change-down' : 'change-flat';
        const sign = diff > 0 ? '▲' : diff < 0 ? '▼' : '';
        changeChip = '<span class="change-chip ' + cls + '">' +
          sign + Math.abs(diff).toFixed(0) + '円 (' + (diff >= 0 ? '+' : '') + pct + '%)</span>';
      }
      const priceStr = item.price ? '¥' + Number(item.price.replace(/,/g,'')).toLocaleString() : '-';

      return '<div class="card">' +
        '<div class="card-top">' +
          '<div>' +
            '<div class="card-name">' + esc(item.name) + '</div>' +
            '<div class="card-code">' + esc(item.code) + '</div>' +
            changeChip +
          '</div>' +
          '<span class="badge ' + badgeCls + '">' + badgeTxt + '</span>' +
        '</div>' +
        '<div class="card-metrics">' +
          metric('株価',     priceStr) +
          metric('配当利回', item.divYield ? item.divYield + '%' : '-') +
          metric('理想利回', item.ideal   ? item.ideal   + '%' : '-') +
          metric('ギャップ', gap !== '-'  ? gap + '%'          : '-') +
        '</div>' +
        (item.owned && item.owned !== '0' ? (() => {
          const owned = parseFloat(item.owned);
          const price = parseFloat(item.price.replace(/,/g,''));
          const divY  = parseFloat(item.divYield);
          const holdVal = (!isNaN(owned) && !isNaN(price)) ? Math.round(owned * price) : null;
          const annDiv  = (holdVal && !isNaN(divY)) ? Math.round(holdVal * divY / 100) : null;
          return '<div class="owned-row">' +
            '📦 ' + owned + '株保有' +
            (holdVal ? ' ／ 評価額 ¥' + holdVal.toLocaleString() : '') +
            (annDiv  ? ' ／ 配当見込 ¥' + annDiv.toLocaleString() : '') +
            '</div>';
        })() : '') +
        '<div class="gap-bar">' +
          '<div class="gap-track"><div class="gap-fill" style="width:' + pct + '%"></div></div>' +
          '<div class="gap-label">理想利回に対して ' + pct + '%</div>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  const MONTH_NAMES = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

  function renderCalendar(calendar, pf) {
    if (!calendar) return;
    const now = new Date();
    const currentMonth = now.getMonth() + 1;
    const totalDiv = pf && pf.totalDividend ? pf.totalDividend : 0;

    // 年間サマリー
    const summaryEl = document.getElementById('yearSummary');
    if (totalDiv > 0) {
      const monthly = Math.round(totalDiv / 12);
      summaryEl.innerHTML =
        '<div class="ys-label">年間配当見込み</div>' +
        '<div class="ys-value">¥<span>' + totalDiv.toLocaleString() + '</span></div>' +
        '<div class="ys-sub">月平均 ¥' + monthly.toLocaleString() + ' ／ 週平均 ¥' +
          Math.round(totalDiv / 52).toLocaleString() + '</div>';
    }

    // カレンダーグリッド
    document.getElementById('calendarGrid').innerHTML = calendar.map(function(m) {
      const isCurrent  = m.month === currentMonth;
      const hasDiv     = m.amount > 0;
      const cls = 'cal-month' + (hasDiv ? ' has-dividend' : '') + (isCurrent ? ' is-current' : '');
      const stockStr   = m.stocks.length > 0
        ? m.stocks.slice(0, 3).join('<br>') + (m.stocks.length > 3 ? '<br>他' + (m.stocks.length - 3) + '件' : '')
        : '';
      return '<div class="' + cls + '">' +
        (isCurrent ? '<div class="cal-today-badge">今月</div>' : '') +
        '<div class="cal-month-num">' + m.month + '</div>' +
        '<div class="cal-month-name">' + MONTH_NAMES[m.month - 1] + '</div>' +
        (hasDiv
          ? '<div class="cal-amount">¥' + m.amount.toLocaleString() + '</div>' +
            '<div class="cal-stocks">' + stockStr + '</div>'
          : '<div class="cal-stocks" style="color:var(--border)">—</div>') +
        '</div>';
    }).join('');
  }

  function renderPortfolio(pf) {
    const el = document.getElementById('portfolioBanner');
    if (!pf || pf.totalValue === 0) { el.style.display = 'none'; return; }
    el.style.display = 'flex';
    el.innerHTML =
      '<div class="pf-item"><div class="pf-label">保有総額</div>' +
      '<div class="pf-value">¥' + pf.totalValue.toLocaleString() + '</div></div>' +
      '<div class="pf-item"><div class="pf-label">年間配当見込み</div>' +
      '<div class="pf-value dividend">¥' + pf.totalDividend.toLocaleString() + '</div></div>' +
      '<div class="pf-item"><div class="pf-label">配当利回(実績)</div>' +
      '<div class="pf-value dividend">' +
        (pf.totalValue > 0 ? (pf.totalDividend / pf.totalValue * 100).toFixed(2) : '-') +
      '%</div></div>';
  }

  function metric(label, value) {
    return '<div><div class="metric-label">' + label + '</div>' +
           '<div class="metric-value">' + value + '</div></div>';
  }

  function esc(s) {
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ========== 受取記録タブ ==========
  var recordLoaded = false;

  function loadRecords() {
    document.getElementById('viewRecord').innerHTML =
      '<div class="placeholder">読み込み中...</div>';
    google.script.run
      .withSuccessHandler(function(res) {
        if (!res || !res.ok) {
          document.getElementById('viewRecord').innerHTML =
            '<div class="error-box">⚠️ ' + (res && res.message || '読み込みエラー') + '</div>';
          return;
        }
        recordLoaded = true;
        renderRecordView(res);
      })
      .withFailureHandler(function(err) {
        document.getElementById('viewRecord').innerHTML =
          '<div class="error-box">⚠️ ' + err.message + '</div>';
      })
      .getDividendRecords();
  }

  function renderRecordView(res) {
    var stats   = res.stats;
    var records = res.records;
    var html = '';

    // ヒーローバナー
    html += '<div class="record-hero">';
    html += '<div class="rh-label">これまでの受取配当金</div>';
    html += '<div class="rh-total">¥<span>' + stats.total.toLocaleString() + '</span></div>';
    html += '<div class="rh-sub">受取回数 ' + stats.count + '回</div>';
    if (stats.thisYearTotal > 0) {
      html += '<div class="rh-year">📅 今年: ¥' + stats.thisYearTotal.toLocaleString() + '</div>';
    }
    html += '</div>';

    // 月別棒グラフ
    var maxMonthly = 0;
    stats.monthly.forEach(function(m) { if (m.amount > maxMonthly) maxMonthly = m.amount; });
    html += '<div class="record-section"><h3>月別受取金額（直近12ヶ月）</h3>';
    html += '<div class="bar-chart">';
    stats.monthly.forEach(function(m) {
      var h = maxMonthly > 0 ? Math.max(2, Math.round(m.amount / maxMonthly * 74)) : 2;
      html += '<div class="bar-col">';
      html += '<div class="bar" style="height:' + h + 'px" title="¥' + m.amount.toLocaleString() + '"></div>';
      html += '<div class="bar-label">' + m.label + '</div>';
      html += '</div>';
    });
    html += '</div></div>';

    // TOP銘柄
    if (stats.topStocks && stats.topStocks.length > 0) {
      var maxTop = stats.topStocks[0].amount || 1;
      html += '<div class="record-section"><h3>受取金額 TOP銘柄</h3>';
      html += '<div class="top-stocks">';
      stats.topStocks.forEach(function(ts) {
        var pct = Math.round(ts.amount / maxTop * 100);
        html += '<div class="top-stock-row">';
        html += '<span style="font-size:0.85rem;font-weight:600;min-width:80px">' + esc(ts.name) + '</span>';
        html += '<div class="ts-bar-wrap"><div class="ts-bar" style="width:' + pct + '%"></div></div>';
        html += '<span style="font-size:0.85rem;font-weight:700;color:var(--success);white-space:nowrap">¥' + Math.round(ts.amount).toLocaleString() + '</span>';
        html += '</div>';
      });
      html += '</div></div>';
    }

    // 入力フォーム
    var now = new Date();
    var mm  = ('0' + (now.getMonth() + 1)).slice(-2);
    var dd  = ('0' + now.getDate()).slice(-2);
    var defaultDate = now.getFullYear() + '/' + mm + '/' + dd;

    var stockOptions = '<option value="">銘柄を選択（任意）</option>';
    if (allItems && allItems.length > 0) {
      allItems.forEach(function(item) {
        if (item.code || item.name) {
          stockOptions += '<option value="' + esc(item.code) + '|' + esc(item.name) + '">' +
            esc(item.code) + ' ' + esc(item.name) + '</option>';
        }
      });
    }

    html += '<div style="padding:12px 12px 0">';
    html += '<div class="record-form">';
    html += '<h3>📝 配当受取を記録</h3>';
    html += '<div class="form-row">';
    html += '<div class="form-field"><label>受取日</label>' +
      '<input type="text" id="rDate" value="' + defaultDate + '" placeholder="2025/06/01"></div>';
    html += '<div class="form-field"><label>受取金額（円）</label>' +
      '<input type="number" id="rAmount" placeholder="5000" min="1"></div>';
    html += '</div>';
    html += '<div class="form-row">';
    html += '<div class="form-field full"><label>銘柄を選択</label>' +
      '<select id="rStock" onchange="onStockSelect(this.value)">' + stockOptions + '</select></div>';
    html += '</div>';
    html += '<div class="form-row">';
    html += '<div class="form-field"><label>銘柄コード</label>' +
      '<input type="text" id="rCode" placeholder="1234"></div>';
    html += '<div class="form-field"><label>銘柄名</label>' +
      '<input type="text" id="rName" placeholder="例: 〇〇銀行"></div>';
    html += '</div>';
    html += '<div class="form-row">';
    html += '<div class="form-field full"><label>メモ（任意）</label>' +
      '<input type="text" id="rMemo" placeholder="中間配当 など"></div>';
    html += '</div>';
    html += '<button class="btn-save" id="rSaveBtn" onclick="submitRecord()">💾 保存する</button>';
    html += '</div></div>';

    // 受取履歴一覧
    html += '<div class="record-section"><h3>受取履歴</h3></div>';
    html += '<div class="record-list" id="recordList">';
    if (records.length === 0) {
      html += '<div class="placeholder" style="padding:30px 20px">まだ記録がありません</div>';
    } else {
      records.forEach(function(r) {
        html += '<div class="record-item">';
        html += '<div class="ri-left">';
        html += '<div class="ri-name">' + esc(r.name || r.code || '不明') + '</div>';
        html += '<div class="ri-date">' + esc(r.date) + (r.memo ? ' ／ ' + esc(r.memo) : '') + '</div>';
        html += '</div>';
        html += '<div class="ri-amount">¥' + r.amount.toLocaleString() + '</div>';
        html += '</div>';
      });
    }
    html += '</div>';
    html += '<div style="height:40px"></div>';

    document.getElementById('viewRecord').innerHTML = html;
  }

  function onStockSelect(val) {
    if (!val) return;
    var parts = val.split('|');
    var codeEl = document.getElementById('rCode');
    var nameEl = document.getElementById('rName');
    if (codeEl) codeEl.value = parts[0] || '';
    if (nameEl) nameEl.value = parts[1] || '';
  }

  function submitRecord() {
    var date   = document.getElementById('rDate')   ? document.getElementById('rDate').value   : '';
    var amount = document.getElementById('rAmount') ? document.getElementById('rAmount').value : '';
    var code   = document.getElementById('rCode')   ? document.getElementById('rCode').value   : '';
    var name   = document.getElementById('rName')   ? document.getElementById('rName').value   : '';
    var memo   = document.getElementById('rMemo')   ? document.getElementById('rMemo').value   : '';

    if (!date.trim() || !amount || parseFloat(amount) <= 0) {
      alert('受取日と受取金額は必須です。');
      return;
    }

    var btn = document.getElementById('rSaveBtn');
    if (btn) { btn.disabled = true; btn.textContent = '保存中...'; }

    google.script.run
      .withSuccessHandler(function(res) {
        if (!res || !res.ok) {
          alert('保存エラー: ' + (res && res.message || '不明'));
          if (btn) { btn.disabled = false; btn.textContent = '💾 保存する'; }
          return;
        }
        recordLoaded = false;
        loadRecords();
      })
      .withFailureHandler(function(err) {
        alert('保存エラー: ' + err.message);
        if (btn) { btn.disabled = false; btn.textContent = '💾 保存する'; }
      })
      .saveDividendRecord(date.trim(), code.trim(), name.trim(), parseFloat(amount), memo.trim());
  }

  // プルトゥリフレッシュ
  let touchStartY = 0;
  document.addEventListener('touchstart', function(e) {
    touchStartY = e.touches[0].clientY;
  }, { passive: true });
  document.addEventListener('touchend', function(e) {
    const dy = e.changedTouches[0].clientY - touchStartY;
    if (dy > 80 && window.scrollY === 0 && !isLoading) {
      load(false);
    }
  }, { passive: true });

  // 初回ロード
  load(false);

  // 5分ごとに自動表示更新
  setInterval(function() { load(false); }, 300000);

  // 更新ボタン
  document.getElementById('updateBtn').addEventListener('click', function() {
    load(true);
  });
</script>
</body>
</html>
